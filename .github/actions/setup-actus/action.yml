name: Setup pinned Actus compiler
description: Build the pinned Actus compiler used by Twin-e CI
inputs:
  actus-ref:
    description: Actus repository commit or tag
    required: false
    default: ed64884b3c1c235e85c1fe7fdd114d4074a94898
runs:
  using: composite
  steps:
    - name: Checkout Actus compiler
      uses: actions/checkout@v4
      with:
        repository: actus-lang/actus
        ref: ${{ inputs.actus-ref }}
        path: .ci/actus
        fetch-depth: 1

    - name: Install stable Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build Actus compiler
      shell: bash
      run: cargo build --locked --release --bin actus --manifest-path .ci/actus/Cargo.toml

    - name: Export compiler path
      shell: bash
      run: echo "ACTUS=${GITHUB_WORKSPACE}/.ci/actus/target/release/actus" >> "${GITHUB_ENV}"
